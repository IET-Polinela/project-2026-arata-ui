{% extends 'base.html' %}
{% block title %}Masuk Aplikasi - Smart City{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-dark text-white text-center py-4">
                <h3 class="mb-1 fw-bold">🔑 Masuk Aplikasi</h3>
                <p class="text-white-50 small mb-0">Portal Manajemen Permasalahan Kota Smart City</p>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger">Username atau password salah!</div>
                {% endif %}
                <form method="POST" class="needs-validation" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold text-secondary">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Masukkan username" required>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold text-secondary">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Masukkan password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow-sm">Masuk Sekarang</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
