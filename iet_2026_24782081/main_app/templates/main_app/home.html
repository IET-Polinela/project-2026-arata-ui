<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartCity - Daftar Laporan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🏙️ SmartCity Portal</span>
            <a href="{% url 'add_report' %}" class="btn btn-light">+ Buat Laporan</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Daftar Laporan Terkini</h2>
        <div class="row">
            {% for report in reports %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h5 class="card-title text-primary">{{ report.title }}</h5>
                            <span class="badge bg-warning text-dark">{{ report.status }}</span>
                        </div>
                        <h6 class="card-subtitle mb-2 text-muted">{{ report.location }}</h6>
                        <p class="card-text">{{ report.description|truncatewords:20 }}</p>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="alert alert-info">Belum ada laporan masuk.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
