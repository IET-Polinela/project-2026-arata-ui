{% extends 'base.html' %}

{% block title %}Konfirmasi Hapus Laporan{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 border-start border-danger border-4">
            <div class="card-body p-4 text-center">
                <div class="text-danger mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
                        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                </div>
                <h3 class="fw-bold text-dark mb-2">Hapus Laporan Secara Permanen?</h3>
                <p class="text-muted">Apakah kamu benar-benar yakin ingin menghapus laporan dengan judul <br><strong class="text-danger">"{{ object.title }}"</strong>? Tindakan ini tidak dapat dibatalkan.</p>
                
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4 py-2 fw-bold shadow-sm me-2">Ya, Hapus Data</button>
                    <a href="{% url 'report_list' %}" class="btn btn-outline-secondary px-4 py-2 fw-semibold">Batal</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
