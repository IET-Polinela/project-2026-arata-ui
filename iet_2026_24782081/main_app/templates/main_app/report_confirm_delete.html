<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Konfirmasi Hapus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="alert alert-danger text-center shadow-sm mx-auto" style="max-width: 500px;">
            <h4>Konfirmasi Penghapusan Data</h4>
            <p>Apakah kamu yakin ingin menghapus laporan berkode judul <strong>"{{ object.title }}"</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">Ya, Hapus Data</button>
                <a href="{% url 'report_list' %}" class="btn btn-secondary">Batal</a>
            </form>
        </div>
    </div>
</body>
</html>
