<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Laporan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow max-width mx-auto" style="max-width: 700px;">
            <div class="card-header bg-info text-white">
                <h3 class="mb-0">{{ report.title }}</h3>
            </div>
            <div class="card-body">
                <p><strong>Kategori:</strong> <span class="badge bg-secondary">{{ report.category }}</span></p>
                <p><strong>Lokasi Kejadian:</strong> {{ report.location }}</p>
                <p><strong>Status Saat Ini:</strong> <span class="text-danger font-weight-bold">{{ report.status }}</span></p>
                <hr>
                <h5>Deskripsi Permasalahan:</h5>
                <p>{{ report.description }}</p>
                <hr>
                <p class="text-muted small">Dilaporkan pada: {{ report.created_at }}</p>
                <a href="{% url 'report_list' %}" class="btn btn-secondary mt-3">Kembali ke Beranda</a>
            </div>
        </div>
    </div>
</body>
</html>
